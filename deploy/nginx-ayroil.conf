# ayroil stack — HTTP reverse proxy. certbot adds :443 blocks after DNS resolves.
# Reference copy of /etc/nginx/sites-enabled/ayroil on the Hetzner box.
map $http_upgrade $ayroil_conn_upgrade { default upgrade; '' close; }

# ---------------- STOREFRONT (apex + www) -> :3400 ----------------
server {
    listen 80;
    listen [::]:80;
    server_name ayroil.com www.ayroil.com;
    client_max_body_size 25m;

    # Canonical host: 301 the apex to www.
    if ($host = ayroil.com) { return 301 https://www.ayroil.com$request_uri; }

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ayroil_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
    }
}

# ---------------- ADMIN -> :3401 ----------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.ayroil.com;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:3401;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ayroil_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
    }
}

# ---------------- API -> :4400 ----------------
server {
    listen 80;
    listen [::]:80;
    server_name api.ayroil.com;
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ayroil_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        send_timeout 300;
    }
}
